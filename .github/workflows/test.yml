name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax checks
        run: |
          node --check server.mjs
          node --check public/app.js
          node --check public/sw.js
          node -e "for (const p of ['dsh-web-mobile','dsh-ops']) { const j=require('./plugins/'+p+'/package.json'); if (!j.version) process.exit(1) }"
          sh -n scripts/start.sh
          sh -n scripts/install-plugins.sh
          sh -n scripts/install-dsh-reset-page.sh
          sh -n scripts/sync-github.sh
          sh -n android-app/build.sh
      - name: Smoke test
        run: node test/smoke.mjs
